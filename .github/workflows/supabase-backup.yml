name: Supabase Weekly Backup

on:
  schedule:
    # Weekly, Sunday 04:00 UTC.
    - cron: '0 4 * * 0'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 17 client
        # Ubuntu's default postgresql-client is v16, but Supabase runs
        # Postgres 17, and pg_dump refuses to dump a server newer than
        # itself. Pull the matching client from the official PGDG repo.
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Dump database
        # Individual PG* vars instead of one URI: PGPASSWORD is read as a
        # raw literal, so special characters in the password can't get
        # mangled by URI parsing (e.g. a stray '#' silently truncating
        # everything after it as a URI fragment).
        run: |
          /usr/lib/postgresql/17/bin/pg_dump \
            --no-owner --no-privileges --format=custom \
            -f "backup-$(date +%Y-%m-%d).dump"
        env:
          PGHOST: aws-1-ap-northeast-2.pooler.supabase.com
          PGPORT: 5432
          PGUSER: postgres.kepwsajtixlcjbabfxlk
          PGDATABASE: postgres
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backup-*.dump
          retention-days: 90
