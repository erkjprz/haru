name: Supabase Keep-Alive

on:
  schedule:
    # Every 3 days, well under Supabase's 7-day inactivity pause threshold.
    - cron: '0 3 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        # The anon key is safe to expose here: it's the same public key
        # already shipped client-side (NEXT_PUBLIC_SUPABASE_ANON_KEY), and
        # RLS -- not key secrecy -- is what protects the data.
        run: |
          curl -sf "https://kepwsajtixlcjbabfxlk.supabase.co/rest/v1/" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtlcHdzYWp0aXhsY2piYWJmeGxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5Mjk2MjQsImV4cCI6MjA5OTUwNTYyNH0.5wjVQb1fiKuEdx0gxjgZgno7qbxE1JTLyzTR3hzhBcQ" \
            -o /dev/null
